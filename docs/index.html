<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Utopia Signs — rankings</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<style>
/* ============================================================================
   Rank Tracker — visual system
   Chart/series and status colours are the validated data-viz tokens. Deltas
   always pair colour with a ↑/↓ glyph, because red↔green is the classic
   colour-vision collision and hue must never carry the meaning alone.
   ========================================================================= */

:root {
  color-scheme: light;

  /* surfaces & ink */
  --bg:            #f7f7f5;
  --surface:       #ffffff;
  --surface-2:     #fbfbfa;
  --border:        #e5e4de;
  --border-strong: #d5d4cc;
  --text:          #0b0b0b;
  --text-2:        #52514e;
  --muted:         #898781;

  /* brand / series */
  --accent:        #2a78d6;
  --accent-ink:    #ffffff;
  --accent-wash:   #eaf2fc;
  --series-1:      #2a78d6;

  /* status — always shipped with an icon or label */
  --up:            #006300;
  --down:          #d03b3b;
  --warn:          #8a5a00;

  --chip:          #f0efeb;
  --grid:          #e1e0d9;

  --radius:   12px;
  --radius-sm: 8px;
  --shadow:    0 1px 2px rgb(11 11 11 / .04), 0 1px 3px rgb(11 11 11 / .06);
  --shadow-lg: 0 10px 30px rgb(11 11 11 / .12), 0 2px 8px rgb(11 11 11 / .08);
  --ring:      0 0 0 3px rgb(42 120 214 / .28);
}

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg:            #0d0d0d;
    --surface:       #1a1a19;
    --surface-2:     #212120;
    --border:        #2c2c2a;
    --border-strong: #3a3a37;
    --text:          #ffffff;
    --text-2:        #c3c2b7;
    --muted:         #898781;

    --accent:        #3987e5;
    --accent-ink:    #0b0b0b;
    --accent-wash:   #17263a;
    --series-1:      #3987e5;

    --up:            #0ca30c;
    --down:          #e66767;
    --warn:          #fab219;

    --chip:          #262624;
    --grid:          #2c2c2a;
    --shadow:    none;
    --shadow-lg: 0 10px 30px rgb(0 0 0 / .5);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

h1 { font-size: 1.5rem; letter-spacing: -.02em; margin: 0 0 .15rem; }
h2 { font-size: 1.05rem; letter-spacing: -.01em; margin: 0 0 .6rem; }
a  { color: var(--accent); }
.muted { color: var(--muted); }
.hidden { display: none !important; }
.pad { padding: 1rem; }
.nowrap { white-space: nowrap; }

:focus-visible { outline: none; box-shadow: var(--ring); border-radius: 6px; }

/* ------------------------------------------------------------------ top bar */

.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .65rem 1.4rem;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 30;
}
.brand {
  display: flex; align-items: center; gap: .6rem;
  font-weight: 620; font-size: 1.02rem; letter-spacing: -.02em;
}
.logo { width: 30px; height: 30px; flex: none; border-radius: 9px; }
.brand-sub {
  font-size: .68rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
  color: var(--muted); border-left: 1px solid var(--border); padding-left: .6rem; margin-left: .1rem;
}
/* Single row, always. The project name is the only elastic element, so it
   truncates rather than pushing the buttons onto a second line. */
.topbar-right { display: flex; gap: .45rem; align-items: center; flex-wrap: nowrap; min-width: 0; }
.topbar-right select {
  width: auto; min-width: 10rem; max-width: 22rem;
  text-overflow: ellipsis; padding-right: 1.8rem;
}
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 2.25rem; height: 2.25rem; padding: 0; flex: none;
}

/* ------------------------------------------------------------------- icons */

.icon { flex: none; vertical-align: -.15em; }
button > .icon, .button > .icon { margin-right: .4rem; vertical-align: -.2em; }
.icon-btn > .icon { margin: 0; }
button, .button { display: inline-flex; align-items: center; }
.icon.spin { animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.delta .icon { margin: 0 .1rem 0 0; vertical-align: -.12em; }
.stat-value .icon { vertical-align: -.05em; }
.link-btn { display: inline-flex; align-items: center; }
.link-btn > .icon { margin: 0; }
.drag-handle > .icon { display: block; }

main { max-width: 1200px; margin: 0 auto; padding: 1.6rem 1.4rem 5rem; }

/* ----------------------------------------------------------------- controls */

button, .button {
  font: inherit; font-weight: 500; cursor: pointer;
  border-radius: var(--radius-sm); padding: .48rem .9rem;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
  text-decoration: none; display: inline-block; white-space: nowrap;
  transition: background .13s ease, border-color .13s ease, transform .06s ease;
}
button:hover, .button:hover { background: var(--surface-2); border-color: var(--muted); }
button:active { transform: translateY(.5px); }
button:disabled { opacity: .45; cursor: not-allowed; transform: none; }

.primary {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 560;
}
.primary:hover { background: color-mix(in srgb, var(--accent) 86%, #000); border-color: transparent; }
.danger { color: var(--down); border-color: color-mix(in srgb, var(--down) 45%, var(--border)); }
.danger:hover { background: color-mix(in srgb, var(--down) 8%, transparent); }
.ghost { background: transparent; }
.link-btn {
  background: none; border: none; color: var(--accent); padding: .2rem .35rem;
  font-weight: 500; border-radius: 6px;
}
.link-btn:hover { background: var(--accent-wash); }

input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  padding: .48rem .65rem; width: 100%;
  transition: border-color .13s ease, box-shadow .13s ease;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: var(--ring); outline: none; }
textarea { resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88rem; }
label { display: block; font-size: .82rem; color: var(--text-2); font-weight: 520; }
label input, label select, label textarea { margin-top: .3rem; font-weight: 400; }
.stack { display: grid; gap: .9rem; max-width: 24rem; }

/* ------------------------------------------------------------------- panels */

.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 1.1rem; margin-bottom: 1.1rem;
}
.table-panel { padding: 0; overflow: hidden; overflow-x: auto; }

.project-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 1rem; flex-wrap: wrap; margin-bottom: 1.3rem;
}
.project-head .actions { display: flex; gap: .5rem; flex-wrap: wrap; }

/* -------------------------------------------------------------- add keywords */

.add-block summary {
  cursor: pointer; font-weight: 560; color: var(--accent); list-style: none;
  padding: .1rem 0;
}
.add-block summary::-webkit-details-marker { display: none; }
.add-block summary::before { content: '＋ '; font-weight: 400; }
.add-block[open] summary::before { content: '− '; }
.kw-form { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: .8rem; align-items: end; margin-top: 1rem; }
.kw-form .wide { grid-column: 1 / -1; }
.kw-form button { height: 2.4rem; }
.note { margin: .7rem 0 0; font-size: .82rem; }
@media (max-width: 760px) { .kw-form { grid-template-columns: 1fr; } }

/* ----------------------------------------------------------------- sections */

.engine-section { margin-bottom: 2.4rem; }
.engine-head {
  display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
  margin-bottom: .9rem; padding-bottom: .65rem; border-bottom: 1px solid var(--border-strong);
}
.engine-head h2 { margin: 0; font-size: 1.14rem; }
.engine-kind {
  font-size: .68rem; font-weight: 650; text-transform: uppercase; letter-spacing: .07em;
  color: var(--accent); background: var(--accent-wash);
  padding: .18rem .55rem; border-radius: 999px;
}
.engine-sub { font-size: .83rem; color: var(--muted); margin-left: auto; }
.engine-run { font-size: .83rem; padding: .38rem .8rem; }

/* --------------------------------------------------------------- stat tiles */

.stat-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
  gap: .7rem; margin-bottom: 1rem;
}
.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: .7rem .85rem; box-shadow: var(--shadow);
}
.stat-label {
  font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); margin-bottom: .25rem;
}
.stat-value { font-size: 1.5rem; font-weight: 640; letter-spacing: -.02em; line-height: 1.1; }
.stat-value.up { color: var(--up); }
.stat-value.down { color: var(--down); }
.stat-sub { font-size: .74rem; color: var(--muted); margin-top: .1rem; }

/* ------------------------------------------------------------------ banners */

.banner {
  background: color-mix(in srgb, var(--warn) 9%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--warn) 30%, var(--border));
  border-radius: var(--radius-sm);
  padding: .75rem 1rem; margin-bottom: 1rem; font-size: .86rem;
  display: flex; gap: .55rem; align-items: baseline; flex-wrap: wrap;
}
.banner strong { color: var(--warn); }

/* -------------------------------------------------------------------- table */

table { width: 100%; border-collapse: collapse; font-size: .9rem; }
thead th {
  text-align: left; font-size: .69rem; text-transform: uppercase; letter-spacing: .07em;
  color: var(--muted); font-weight: 650; padding: .7rem .7rem;
  border-bottom: 1px solid var(--border-strong); white-space: nowrap;
  background: var(--surface-2); position: sticky; top: 0; z-index: 1;
}
tbody td { padding: .65rem .7rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background .1s ease; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.inactive { opacity: .45; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.col-kw { min-width: 10rem; }
.kw-cell { font-weight: 550; }
.kw-url {
  display: block; font-size: .75rem; color: var(--muted);
  max-width: 13rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.pos { font-size: 1.08rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.delta { font-variant-numeric: tabular-nums; font-weight: 560; }
.delta.up { color: var(--up); }
.delta.down { color: var(--down); }
.delta.flat { color: var(--muted); }

.chip {
  display: inline-block; padding: .16rem .55rem; border-radius: 999px;
  background: var(--chip); color: var(--text-2); font-size: .73rem; font-weight: 600; white-space: nowrap;
}
.chip.absent { color: var(--muted); }
.chip.blocked { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.chip.error { color: var(--down); background: color-mix(in srgb, var(--down) 12%, transparent); }
.chip.new { color: var(--accent); background: var(--accent-wash); }

.row-actions { display: flex; gap: .05rem; justify-content: flex-end; white-space: nowrap; opacity: .55; transition: opacity .12s ease; }
tbody tr:hover .row-actions { opacity: 1; }
.danger-btn:hover { color: var(--down); background: color-mix(in srgb, var(--down) 10%, transparent); }

/* ---------------------------------------------------------- drag to reorder */

.drag-cell { width: 1.7rem; padding-right: 0 !important; }
.drag-handle {
  cursor: grab; color: var(--muted); opacity: .35; user-select: none;
  font-size: 1rem; line-height: 1; display: inline-block; padding: .15rem;
}
tbody tr:hover .drag-handle { opacity: .75; }
.drag-handle:hover { opacity: 1 !important; color: var(--accent); }
.drag-handle:active { cursor: grabbing; }
.drag-handle.off { cursor: not-allowed; opacity: .15 !important; }
.drag-handle.off:hover { color: var(--muted); }
tbody tr.dragging { opacity: .35; }
tbody tr.drop-above td { box-shadow: inset 0 2px 0 var(--accent); }
tbody tr.drop-below td { box-shadow: inset 0 -2px 0 var(--accent); }

/* -------------------------------------------------------------- sortable th */

th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
th.sorted { color: var(--accent); }
th .arrow { font-size: .7em; }
.sort-note { font-size: .8rem; color: var(--muted); margin: .55rem 0 0; }

/* ---------------------------------------------------------------- run panel */

.run-panel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
.run-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: .65rem; }
.progress { height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; }
#run-bar {
  height: 100%; width: 0; border-radius: 99px;
  background: var(--accent); transition: width .35s cubic-bezier(.4,0,.2,1);
}
.run-queue {
  margin-top: .85rem; padding: .65rem .8rem;
  border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); font-size: .84rem;
}
.queue-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .35rem; }
.queue-item {
  display: flex; align-items: center; gap: .6rem; padding: .3rem 0;
  color: var(--text-2); border-top: 1px solid var(--border);
}
.queue-n {
  min-width: 1.35rem; height: 1.35rem; border-radius: 999px; background: var(--chip);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: .71rem; font-weight: 650; flex: none;
}
.queue-x { margin-left: auto; }
.run-log {
  margin: .85rem 0 0; max-height: 15rem; overflow: auto; font-size: .79rem; line-height: 1.6;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
  color: var(--text-2); background: var(--bg); padding: .75rem; border-radius: var(--radius-sm);
}

.disclaimer {
  font-size: .81rem; color: var(--muted); line-height: 1.65;
  border-left: 2px solid var(--border-strong); padding-left: .95rem; margin-top: 1.5rem;
}

/* -------------------------------------------------------------------- modal */

.backdrop {
  position: fixed; inset: 0; background: rgb(11 11 11 / .5);
  backdrop-filter: blur(2px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 3rem 1rem; z-index: 50; overflow: auto;
}
.modal {
  background: var(--surface); border-radius: 14px; border: 1px solid var(--border);
  box-shadow: var(--shadow-lg); max-width: 46rem; width: 100%; padding: 1.5rem;
}
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1.1rem; }
.modal .close { border: none; background: none; font-size: 1.35rem; line-height: 1; color: var(--muted); padding: .1rem .4rem; }
.modal .close:hover { color: var(--text); background: var(--chip); }
.modal-actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1.3rem; }

/* -------------------------------------------------------------------- chart */

.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--series-1); }
.chart .lbl { fill: var(--muted); font-size: 10px; }
.chart g { cursor: crosshair; }
.chart g:hover .dot { r: 5; }

.spark { display: block; }
.spark path { fill: none; stroke: var(--series-1); stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }
.spark .flat { stroke: var(--muted); }
.spark-btn { background: none; border: none; padding: .15rem .25rem; border-radius: 6px; line-height: 0; }
.spark-btn:hover { background: var(--chip); }
.spark-btn:disabled { background: none; }

/* --------------------------------------------------------------- serp lists */

.serp-list { list-style: none; padding: 0; margin: .55rem 0 0; font-size: .84rem; max-height: 18rem; overflow: auto; }
.serp-list li { display: flex; gap: .65rem; padding: .4rem .3rem; border-bottom: 1px solid var(--border); border-radius: 6px; }
.serp-list li.mine { background: var(--accent-wash); font-weight: 600; }
.serp-list .n { color: var(--muted); min-width: 1.7rem; text-align: right; font-variant-numeric: tabular-nums; }
.serp-list .u { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.hist-table { font-size: .84rem; margin-top: .6rem; }
.form-grid { display: grid; gap: .9rem; }
.hint { font-size: .8rem; color: var(--muted); line-height: 1.6; }
.hint code {
  background: var(--chip); padding: .12rem .38rem; border-radius: 5px;
  font-size: .95em; user-select: all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
ol.steps { padding-left: 1.2rem; font-size: .84rem; color: var(--text-2); line-height: 1.75; }

/* -------------------------------------------------------------------- toast */

.toast {
  position: fixed; bottom: 1.4rem; left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: .6rem 1.1rem; border-radius: 10px;
  font-size: .87rem; font-weight: 500; z-index: 100; max-width: 90vw;
  box-shadow: var(--shadow-lg); animation: toast-in .18s ease;
}
.toast.err { background: var(--down); color: #fff; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

body { padding: 0 0 4rem; }
.static-head { max-width: 1180px; margin: 0 auto; padding: 1.6rem 1.2rem .4rem; }
.stamp { font-size: .82rem; color: var(--muted); }
main { padding-top: .6rem; }
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('payload').textContent);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const UI = {
  gsc: { kind: 'Real Google data', sub: '28-day average position',
         cols: DATA.includeMetrics ? ['Avg position','Change','Impressions','Clicks','CTR','Trend','Last checked']
                                   : ['Avg position','Change','Trend','Last checked'],
         absent: () => 'no impressions' },
  duckduckgo: { kind: 'Live SERP', sub: 'Position read from a real browser',
         cols: ['Position','Change','Trend','Last checked'],
         absent: (p, kw) => 'not in top ' + (p.parsed || kw.depth) },
};

function timeAgo(iso) {
  if (!iso) return 'never';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 3600) return Math.max(1, Math.floor(s/60)) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  if (s < 2592000) return Math.floor(s/86400) + 'd ago';
  return new Date(iso).toLocaleDateString();
}

function spark(history) {
  const pts = history.filter(h => h.position != null);
  if (pts.length < 2) return '<span class="muted">—</span>';
  const w=70,h=22,pad=2, vals=pts.map(p=>p.position);
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const d = pts.map((p,i)=>{
    const x=pad+(i*(w-pad*2))/(pts.length-1);
    const y=pad+((p.position-min)/span)*(h-pad*2);
    return (i?'L':'M')+x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><path'+(max===min?' class="flat"':'')+' d="'+d+'"/></svg>';
}

function chart(history, engine) {
  const pts = history;
  const found = pts.filter(p=>p.status==='found').map(p=>p.position);
  if (found.length < 2) return '<p class="hint">Not enough data yet for a trend.</p>';
  const w=640,h=240,padL=40,padR=14,padT=16,padB=30;
  const best=Math.max(0,Math.floor(Math.min(...found)-1)), worst=Math.ceil(Math.max(...found)+1), span=(worst-best)||1;
  const x=i=>padL+(i*(w-padL-padR))/Math.max(pts.length-1,1);
  const y=p=>padT+((p-best)/span)*(h-padT-padB);
  const segs=[]; let cur=[];
  pts.forEach((p,i)=>{ if(p.status==='found') cur.push((cur.length?'L':'M')+x(i).toFixed(1)+','+y(p.position).toFixed(1));
                       else { if(cur.length>1) segs.push(cur.join(' ')); cur=[]; } });
  if (cur.length>1) segs.push(cur.join(' '));
  const dots = pts.map((p,i)=>{
    const detail = p.status==='found'
      ? (engine==='gsc'?'avg position ':'position ')+p.position + (p.impressions!=null?' · '+p.impressions.toLocaleString()+' impressions':'')
      : (engine==='gsc'?'no impressions':'not in top '+(p.parsed||'?'));
    const cy = p.status==='found'? y(p.position) : h-padB;
    const cls = p.status==='found' ? 'class="dot"' : 'fill="var(--muted)" opacity=".55"';
    return '<g><title>'+esc(new Date(p.at).toLocaleString())+' — '+esc(detail)+'</title><circle '+cls+' cx="'+x(i).toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="3.2"/></g>';
  }).join('');
  const ticks=[...new Set([best,Math.round((best+worst)/2),worst])].map(v=>
    '<line class="grid" x1="'+padL+'" y1="'+y(v)+'" x2="'+(w-padR)+'" y2="'+y(v)+'"/><text class="lbl" x="4" y="'+(y(v)+3)+'">'+(engine==='gsc'?'':'#')+v+'</text>').join('');
  const idx=[...new Set([0,Math.floor((pts.length-1)/2),pts.length-1])];
  const labels=idx.map(i=>{
    const a = i===0?'start':(i===pts.length-1?'end':'middle');
    return '<text class="lbl" x="'+x(i).toFixed(1)+'" y="'+(h-8)+'" text-anchor="'+a+'">'+esc(new Date(pts[i].at).toLocaleDateString([], {day:'numeric',month:'short'}))+'</text>';
  }).join('');
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'">'+ticks+segs.map(d=>'<path class="line" d="'+d+'"/>').join('')+dots+labels+'</svg>';
}

function deltaCell(d) {
  if (d === null || d === undefined) return '<span class="muted">—</span>';
  if (d === 0) return '<span class="delta flat">0</span>';
  return '<span class="delta '+(d>0?'up':'down')+'">'+(d>0?'↑':'↓')+' '+Math.abs(d)+'</span>';
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = DATA.projects.map((project, pi) => {
    const sections = DATA.engines.map(({id, label}) => {
      const ui = UI[id];
      const head = '<tr><th class="col-kw">Keyword</th><th>Region</th>' +
        ui.cols.map(c => '<th class="'+(c==='Trend'||c==='Last checked'?'':'num')+'">'+esc(c)+'</th>').join('') + '</tr>';
      const rows = project.keywords.map((kw, ki) => {
        const s = kw.engines[id], l = s.latest;
        const dash = '<span class="muted">—</span>';
        let pos = '<span class="chip">not checked</span>';
        if (l && l.status === 'found') pos = '<span class="pos">'+l.position+'</span>';
        else if (l && l.status === 'absent') pos = '<span class="chip absent">'+esc(ui.absent(l, kw))+'</span>';
        const metrics = (id==='gsc' && DATA.includeMetrics)
          ? '<td class="num">'+(l&&l.status==='found'&&l.impressions!=null?l.impressions.toLocaleString():dash)+'</td>'+
            '<td class="num">'+(l&&l.status==='found'&&l.clicks!=null?l.clicks.toLocaleString():dash)+'</td>'+
            '<td class="num">'+(l&&l.status==='found'&&l.ctr!=null?(l.ctr*100).toFixed(1)+'%':dash)+'</td>'
          : '';
        return '<tr class="kw-row" data-engine="'+id+'" data-p="'+pi+'" data-k="'+ki+'">'+
          '<td><span class="kw-cell">'+esc(kw.keyword)+'</span></td>'+
          '<td class="muted nowrap" title="'+esc(kw.region)+'">'+esc(kw.regionShort)+'</td>'+
          '<td class="num">'+pos+'</td>'+
          '<td class="num">'+deltaCell(s.delta)+'</td>'+
          metrics+
          '<td>'+spark(s.history)+'</td>'+
          '<td class="muted nowrap">'+esc(timeAgo(l && l.at))+'</td></tr>'+
          '<tr class="detail-row hidden" data-for="'+id+'-'+pi+'-'+ki+'"><td colspan="12"><div class="detail-wrap"></div></td></tr>';
      }).join('');
      return '<section class="engine-section">'+
        '<div class="engine-head"><h2>'+esc(label)+'</h2><span class="engine-kind">'+esc(ui.kind)+'</span>'+
        '<span class="engine-sub">'+esc(ui.sub)+'</span></div>'+
        '<div class="panel table-panel"><table><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div></section>';
    }).join('');
    return '<div class="project-head"><div><h1>'+esc(project.name)+'</h1>'+
      '<p class="muted">'+esc(project.domain)+'</p></div></div>'+ sections;
  }).join('') +
  '<p class="stamp">Snapshot taken '+esc(new Date(DATA.generatedAt).toLocaleString())+
  ' · click any row for its trend · checks run locally, this page is read-only</p>';

  // Row click expands the trend chart underneath.
  app.querySelectorAll('.kw-row').forEach(row => {
    row.style.cursor = 'pointer';
    row.addEventListener('click', () => {
      const engine = row.dataset.engine, pi = Number(row.dataset.p), ki = Number(row.dataset.k);
      const detail = app.querySelector('[data-for="'+engine+'-'+pi+'-'+ki+'"]');
      const wrap = detail.querySelector('.detail-wrap');
      if (!detail.classList.contains('hidden')) return detail.classList.add('hidden');
      const kw = DATA.projects[pi].keywords[ki];
      wrap.innerHTML = '<strong>'+esc(kw.keyword)+'</strong> — '+esc(UI[engine].sub)+
        chart(kw.engines[engine].history, engine);
      detail.classList.remove('hidden');
    });
  });
}
render();
</script>
<style>
.detail-row td { background: var(--bg); }
.detail-wrap { padding: .6rem .2rem; }
.hidden { display: none; }
</style>
</body>
</html>
